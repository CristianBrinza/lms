# ─────────────────────────────────────────────────────────────────────────────
# LMS: check every push and pull request: typecheck, lint, tests (real PostgreSQL), production
# builds. Nothing is deployed from here: the production PC builds and releases main itself
# (deploy/updater/update.sh), within a minute of a push.
# ─────────────────────────────────────────────────────────────────────────────
name: CI

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  verify:
    name: Checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: lms
          POSTGRES_PASSWORD: lms
          POSTGRES_DB: lms
        ports: ['5433:5432']
        options: >-
          --health-cmd "pg_isready -U lms -d lms" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: yarn
          cache-dependency-path: |
            yarn.lock
            backend/yarn.lock
            frontend/yarn.lock
      - name: Install
        run: |
          yarn install --frozen-lockfile --non-interactive
          yarn --cwd backend install --frozen-lockfile --non-interactive
          yarn --cwd frontend install --frozen-lockfile --non-interactive
      - run: yarn verify
        env:
          TZ: Europe/Chisinau
