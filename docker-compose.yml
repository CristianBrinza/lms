# Local PostgreSQL for development: `yarn db:up`. Dev-only credentials, bound to localhost.
# Port 5433 so it can run next to other projects' databases on 5432.
services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: lms
      POSTGRES_PASSWORD: lms
      POSTGRES_DB: lms
    ports:
      - '127.0.0.1:5433:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD', 'pg_isready', '-U', 'lms', '-d', 'lms']
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres-data:
