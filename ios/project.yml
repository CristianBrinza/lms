# LMS for iPhone: XcodeGen's spec for the Xcode project (the .xcodeproj itself isn't committed).
# CI (.github/workflows/ios.yml) runs `xcodegen` here, then builds an unsigned LMS.ipa that
# AltServer signs with the person's own Apple ID when it installs it.
name: LMS
options:
  bundleIdPrefix: md.shades
  developmentLanguage: en
  deploymentTarget:
    iOS: '16.0'
  createIntermediateGroups: true
settings:
  base:
    MARKETING_VERSION: '1.0.0'
    CURRENT_PROJECT_VERSION: '1'
    SWIFT_VERSION: '5.0'
    SWIFT_STRICT_CONCURRENCY: minimal
targets:
  LMS:
    type: application
    platform: iOS
    sources:
      - path: LMS
    settings:
      base:
        PRODUCT_NAME: LMS
        PRODUCT_BUNDLE_IDENTIFIER: md.shades.lms
        INFOPLIST_FILE: Config/Info.plist
        GENERATE_INFOPLIST_FILE: 'NO'
        CODE_SIGN_ENTITLEMENTS: Config/LMS.entitlements
        CODE_SIGN_STYLE: Manual
        DEVELOPMENT_TEAM: ''
        TARGETED_DEVICE_FAMILY: '1'
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_BITCODE: 'NO'
        SUPPORTS_MACCATALYST: 'NO'
schemes:
  LMS:
    build:
      targets:
        LMS: all
    run:
      config: Debug
    archive:
      config: Release
