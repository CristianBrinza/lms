# ─────────────────────────────────────────────────────────────────────────────
# LMS server: PostgreSQL, the API, a Cloudflare Tunnel, the updater and nightly backups, on the
# always-on machine (the Windows PC, inside WSL; or any Linux box with Docker).
#
# Nothing listens on the internet: cloudflared dials out to Cloudflare, the tunnel's hostname
# reaches the API inside this network, and only the Cloudflare Worker may use that hostname
# (Cloudflare Access service token + PROXY_SECRET).
#
# The API is not built here: GitHub Actions builds it after every check passes and publishes
# ghcr.io/<owner>/lms-api:main. The updater pulls it (and this repo's deploy files) every minute,
# backs the database up, switches over, and rolls back if the new API isn't healthy.
#
#   deploy/server/setup.sh            # once: settings, secrets, first start
#   deploy/server/status.sh           # what runs, which version, last backups
#
# Settings: deploy/.env (git-ignored; see .env.template). LMS_HOST_DIR there is this repo's path
# on the machine: the updater runs `docker compose` itself and must see the same paths.
# ─────────────────────────────────────────────────────────────────────────────
name: lms

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: lms
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in deploy/.env}
      POSTGRES_DB: lms
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD', 'pg_isready', '-U', 'lms', '-d', 'lms']
      interval: 10s
      timeout: 5s
      retries: 10

  api:
    image: ${LMS_IMAGE:-ghcr.io/cristianbrinza/lms-api}:${LMS_TAG:-main}
    # Only the updater pulls (after a backup); a restart never fetches a new version by itself.
    pull_policy: missing
    restart: unless-stopped
    env_file: .env
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: '8790'
      DATABASE_URL: postgres://lms:${POSTGRES_PASSWORD}@postgres:5432/lms
      # The kitchen's local time: today, best-before dates, meal times and reminders.
      TZ: ${TZ:-Europe/Chisinau}
    depends_on:
      postgres:
        condition: service_healthy
    # For checks from this machine only; the tunnel uses the inner network.
    ports:
      - '127.0.0.1:8790:8790'

  tunnel:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${TUNNEL_TOKEN:?set TUNNEL_TOKEN in deploy/.env}
    depends_on:
      - api

  # Every minute: new deploy files on the branch, or a new API image → back up, switch, check, roll back.
  updater:
    build: ./updater
    restart: unless-stopped
    environment:
      LMS_HOST_DIR: ${LMS_HOST_DIR:?set LMS_HOST_DIR in deploy/.env (this repo's path on the machine)}
      LMS_BRANCH: ${LMS_BRANCH:-main}
      CHECK_EVERY: ${CHECK_EVERY:-60}
      TZ: ${TZ:-Europe/Chisinau}
    volumes:
      # The repo at the same path as on the machine, so `docker compose` resolves the same mounts.
      - ${LMS_HOST_DIR}:${LMS_HOST_DIR}
      - /var/run/docker.sock:/var/run/docker.sock
    working_dir: ${LMS_HOST_DIR}/deploy

  # Nightly pg_dump into deploy/backups (kept KEEP_DAYS days); the updater adds one before each update.
  backup:
    image: postgres:16-alpine
    restart: unless-stopped
    entrypoint: ['/bin/sh', '/scripts/backup-loop.sh']
    environment:
      PGHOST: postgres
      PGUSER: lms
      PGDATABASE: lms
      PGPASSWORD: ${POSTGRES_PASSWORD}
      BACKUP_AT: ${BACKUP_AT:-03:30}
      KEEP_DAYS: ${KEEP_DAYS:-14}
      TZ: ${TZ:-Europe/Chisinau}
    volumes:
      - ./scripts:/scripts:ro
      - ./backups:/backups
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  db-data:
