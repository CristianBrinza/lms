# ─────────────────────────────────────────────────────────────────────────────
# LMS in production, all on the always-on machine (the Windows PC, inside WSL; or any Linux box
# with Docker): PostgreSQL, the app (web app + API in one container), a Cloudflare Tunnel, the
# updater and nightly backups.
#
# Nothing listens on the internet: cloudflared dials out to Cloudflare, and the tunnel's public
# hostname (lms.shades.md) reaches the app inside this network.
#
# The app is built here, from this checkout (the root Dockerfile), never pulled:
#   - a change made on this machine goes live with  deploy/server/live.sh
#   - a change pushed from elsewhere: the updater pulls it within a minute (when this checkout has
#     no local changes) and puts it live the same way
# Both back the database up first, switch, wait for the health check, and roll back if unhealthy.
#
#   deploy/server/setup.sh            # once: settings, secrets, first start
#   deploy/server/status.sh           # what runs, which version, last backups
#
# Settings: deploy/.env (git-ignored; see .env.template). LMS_HOST_DIR there is this repo's path
# on the machine: the updater runs `docker` itself and must see the same paths.
# ─────────────────────────────────────────────────────────────────────────────
name: lms

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: lms
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in deploy/.env}
      POSTGRES_DB: lms
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD', 'pg_isready', '-U', 'lms', '-d', 'lms']
      interval: 10s
      timeout: 5s
      retries: 10

  # The web app and the API (one image, built by deploy/updater/update.sh as lms-app:live).
  api:
    image: lms-app:live
    pull_policy: never
    restart: unless-stopped
    env_file: .env
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: '8790'
      DATABASE_URL: postgres://lms:${POSTGRES_PASSWORD}@postgres:5432/lms
      # Only cloudflared reaches it: the visitor's address comes from Cloudflare's header.
      TRUST_PROXY: 'true'
      # The kitchen's local time: today, best-before dates, meal times and reminders.
      TZ: ${TZ:-Europe/Chisinau}
    depends_on:
      postgres:
        condition: service_healthy
    # For checks from this machine only; the tunnel uses the inner network.
    ports:
      - '127.0.0.1:8790:8790'

  tunnel:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${TUNNEL_TOKEN:?set TUNNEL_TOKEN in deploy/.env}
    depends_on:
      - api

  # Every minute: new commits on the branch → build, back up, switch, check, roll back.
  # deploy/server/live.sh asks it to do the same for this checkout as it is, right now.
  updater:
    build: ./updater
    restart: unless-stopped
    # As the checkout's owner (people edit it too: files it pulls must stay theirs), with the
    # Docker socket's group. setup.sh writes the ids into deploy/.env.
    user: '${LMS_UID:-1000}:${LMS_GID:-1000}'
    group_add:
      - '${DOCKER_GID:-0}'
    environment:
      HOME: /tmp
      BUILDX_GIT_INFO: 'false'
      LMS_HOST_DIR: ${LMS_HOST_DIR:?set LMS_HOST_DIR in deploy/.env (this repo's path on the machine)}
      LMS_BRANCH: ${LMS_BRANCH:-main}
      CHECK_EVERY: ${CHECK_EVERY:-60}
      TZ: ${TZ:-Europe/Chisinau}
    volumes:
      # The repo at the same path as on the machine, so `docker compose` resolves the same mounts.
      - ${LMS_HOST_DIR}:${LMS_HOST_DIR}
      - /var/run/docker.sock:/var/run/docker.sock
    working_dir: ${LMS_HOST_DIR}/deploy

  # Nightly pg_dump into deploy/backups (kept KEEP_DAYS days); the updater adds one before each update.
  backup:
    image: postgres:16-alpine
    restart: unless-stopped
    entrypoint: ['/bin/sh', '/scripts/backup-loop.sh']
    environment:
      PGHOST: postgres
      PGUSER: lms
      PGDATABASE: lms
      PGPASSWORD: ${POSTGRES_PASSWORD}
      BACKUP_AT: ${BACKUP_AT:-03:30}
      KEEP_DAYS: ${KEEP_DAYS:-14}
      TZ: ${TZ:-Europe/Chisinau}
    volumes:
      - ./scripts:/scripts:ro
      - ./backups:/backups
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  db-data:
