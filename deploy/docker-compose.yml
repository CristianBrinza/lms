# ─────────────────────────────────────────────────────────────────────────────
# LMS in production, all on the always-on machine (the Windows PC, inside WSL; or any Linux box
# with Docker): PostgreSQL, the app (web app + API in one container), a Cloudflare Tunnel, the
# updater and nightly backups.
#
# Nothing listens on the internet: cloudflared dials out to Cloudflare, and the tunnel's public
# hostname (lms.shades.md) reaches the app inside this network.
#
# Two networks, so the tunnel reaches the app and nothing else:
#   edge   cloudflared and the app (the app's way out too: web push)
#   data   the app, PostgreSQL and the backups; internal, no way out
# The updater has a network of its own (it fetches from GitHub and drives Docker through the
# socket, never over the network). A public hostname added in the Cloudflare dashboard can point
# at api:8790 only: postgres and the updater don't exist for cloudflared.
#
# The app is built here, from this checkout (the root Dockerfile), never pulled:
#   - a change made on this machine goes live with  deploy/server/live.sh
#   - a change pushed from elsewhere: the updater pulls it within a minute (when this checkout has
#     no local changes) and puts it live the same way
# Both back the database up first, switch, wait for the health check, and roll back if unhealthy.
#
#   deploy/server/setup.sh            # once: settings, secrets, first start
#   deploy/server/status.sh           # what runs, which version, last backups
#
# Settings: deploy/.env (git-ignored; see .env.template). LMS_HOST_DIR there is this repo's path
# on the machine: the updater runs `docker` itself and must see the same paths.
# ─────────────────────────────────────────────────────────────────────────────
name: lms

services:
  postgres:
    image: postgres:16.15-alpine3.24@sha256:721873c34ceb9f8d8fc265984940dc982404c105f19ad51be9fdc5970a6080ea
    restart: unless-stopped
    environment:
      POSTGRES_USER: lms
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in deploy/.env}
      POSTGRES_DB: lms
    volumes:
      - db-data:/var/lib/postgresql/data
    networks: [data]
    security_opt: ['no-new-privileges:true']
    healthcheck:
      test: ['CMD', 'pg_isready', '-U', 'lms', '-d', 'lms']
      interval: 10s
      timeout: 5s
      retries: 10

  # The web app and the API (one image, built by deploy/updater/update.sh as lms-app:live).
  api:
    image: lms-app:live
    pull_policy: never
    restart: unless-stopped
    # Only its own settings, by name: deploy/.env also holds the tunnel token, which the app
    # must never see.
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: '8790'
      DATABASE_URL: postgres://lms:${POSTGRES_PASSWORD}@postgres:5432/lms
      APP_URL: ${APP_URL:?set APP_URL in deploy/.env}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-}
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in deploy/.env}
      JWT_PREVIOUS_SECRET: ${JWT_PREVIOUS_SECRET:-}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      ADMIN_NAME: ${ADMIN_NAME:-}
      ADMIN_SURNAME: ${ADMIN_SURNAME:-}
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
      VAPID_SUBJECT: ${VAPID_SUBJECT:-}
      # Watching: a TMDB v4 read access token (or a v3 API key). Empty: Watching asks for it.
      TMDB_API_KEY: ${TMDB_API_KEY:-}
      # Optional tuning; empty means the app's own default (backend/src/config.ts).
      DATABASE_POOL_MAX: ${DATABASE_POOL_MAX:-}
      ACCESS_TOKEN_TTL_MIN: ${ACCESS_TOKEN_TTL_MIN:-}
      REMEMBER_DAYS: ${REMEMBER_DAYS:-}
      SESSION_HOURS: ${SESSION_HOURS:-}
      DATABASE_SSL: ${DATABASE_SSL:-}
      # The visitor's address comes from Cloudflare's cf-connecting-ip, believed only when the
      # request comes from the tunnel's container (backend/src/lib/client-ip.ts).
      TRUST_PROXY: tunnel
      # The kitchen's local time: today, best-before dates, meal times and reminders.
      TZ: ${TZ:-Europe/Chisinau}
      # The admin's backup download and restore work here (and keep a safety export before a restore).
      BACKUP_DIR: /backups
    volumes:
      - ./backups:/backups
    depends_on:
      postgres:
        condition: service_healthy
    networks: [edge, data]
    # For checks from this machine only; the tunnel uses the edge network.
    ports:
      - '127.0.0.1:8790:8790'
    # It writes nothing to disk (the data is in PostgreSQL): a read-only root, as the image's
    # non-root user, no capabilities, and limits so a flood or a bug can't starve the PC.
    read_only: true
    tmpfs: ['/tmp:size=64m']
    cap_drop: [ALL]
    security_opt: ['no-new-privileges:true']
    mem_limit: 1g
    cpus: 2
    pids_limit: 256

  tunnel:
    image: cloudflare/cloudflared:2026.10.0@sha256:9b49eed8f62806d5d45ddf59ecefb5710429598ea6d3fcccd2af938f621b2b07
    restart: unless-stopped
    # Its metrics stay inside its own container (by default they listen on every interface).
    command: tunnel --no-autoupdate --metrics 127.0.0.1:20241 run
    environment:
      TUNNEL_TOKEN: ${TUNNEL_TOKEN:?set TUNNEL_TOKEN in deploy/.env}
    depends_on:
      - api
    networks: [edge]
    read_only: true
    tmpfs: ['/tmp:size=16m']
    cap_drop: [ALL]
    security_opt: ['no-new-privileges:true']
    mem_limit: 256m
    cpus: 1
    pids_limit: 128

  # Every minute: new commits on the branch → build, back up, switch, check, roll back.
  # deploy/server/live.sh asks it to do the same for this checkout as it is, right now.
  updater:
    build:
      context: ./updater
      args:
        LMS_UID: ${LMS_UID:-1000}
        LMS_GID: ${LMS_GID:-1000}
    restart: unless-stopped
    # As the checkout's owner (people edit it too: files it pulls must stay theirs), with the
    # Docker socket's group. setup.sh writes the ids into deploy/.env.
    user: '${LMS_UID:-1000}:${LMS_GID:-1000}'
    group_add:
      - '${DOCKER_GID:-0}'
    environment:
      HOME: /tmp
      BUILDX_GIT_INFO: 'false'
      LMS_HOST_DIR: ${LMS_HOST_DIR:?set LMS_HOST_DIR in deploy/.env (this repo's path on the machine)}
      LMS_BRANCH: ${LMS_BRANCH:-main}
      CHECK_EVERY: ${CHECK_EVERY:-60}
      # Off by default: only while commit signing is being set up (docs/production.md).
      LMS_ALLOW_UNSIGNED: ${LMS_ALLOW_UNSIGNED:-0}
      TZ: ${TZ:-Europe/Chisinau}
    volumes:
      # The repo at the same path as on the machine, so `docker compose` resolves the same mounts.
      - ${LMS_HOST_DIR}:${LMS_HOST_DIR}
      - /var/run/docker.sock:/var/run/docker.sock
      # The keys whose signed commits it deploys: on the machine, outside the repo, so a commit
      # can't add its own key (setup.sh creates it).
      # Until setup.sh writes LMS_ALLOWED_SIGNERS, an empty file stands in: Compose still starts
      # (an install from before signed deploys keeps running) and the updater refuses every pull.
      - ${LMS_ALLOWED_SIGNERS:-/dev/null}:/run/lms/allowed_signers:ro
    working_dir: ${LMS_HOST_DIR}/deploy
    networks: [updates]
    cap_drop: [ALL]
    security_opt: ['no-new-privileges:true']

  # Nightly pg_dump into deploy/backups (kept KEEP_DAYS days); the updater adds one before each update.
  backup:
    image: postgres:16.15-alpine3.24@sha256:721873c34ceb9f8d8fc265984940dc982404c105f19ad51be9fdc5970a6080ea
    restart: unless-stopped
    entrypoint: ['/bin/sh', '/scripts/backup-loop.sh']
    environment:
      PGHOST: postgres
      PGUSER: lms
      PGDATABASE: lms
      PGPASSWORD: ${POSTGRES_PASSWORD}
      BACKUP_AT: ${BACKUP_AT:-03:30}
      KEEP_DAYS: ${KEEP_DAYS:-14}
      TZ: ${TZ:-Europe/Chisinau}
    volumes:
      - ./scripts:/scripts:ro
      - ./backups:/backups
    depends_on:
      postgres:
        condition: service_healthy
    networks: [data]
    security_opt: ['no-new-privileges:true']

networks:
  edge: {}
  data:
    internal: true
  updates: {}

volumes:
  db-data:
